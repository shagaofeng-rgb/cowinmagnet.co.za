name: News publication check

on:
  schedule:
    - cron: "15 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cowinmagnet-news-publication
  cancel-in-progress: false

jobs:
  publish-when-due:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run news:publish
      - run: npm run test:news
      - run: npm run build
      - name: Commit a pending frontend verification
        run: |
          if git diff --quiet -- data/articles/articles.json data/news-automation; then
            echo "No News article is due."
            exit 0
          fi
          git config user.name "cowinmagnet-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles/articles.json data/news-automation
          git commit -m "Publish News pending frontend verification"
          git push
