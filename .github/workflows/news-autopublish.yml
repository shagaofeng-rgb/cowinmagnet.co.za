name: News candidate discovery

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cowinmagnet-news-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run news:ingest
      - name: Commit new verified candidates only
        run: |
          if git diff --quiet -- data/news-automation; then
            echo "No new eligible News candidates."
            exit 0
          fi
          git config user.name "cowinmagnet-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news-automation
          git commit -m "Store verified News candidates"
          git push
