name: News autopublish

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-autopublish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run news:publish
      - run: npm run test:news
      - run: npm run build
      - name: Commit a due publication
        run: |
          if git diff --quiet -- data/articles/articles.json data/news-automation; then
            echo "No publication is due."
            exit 0
          fi
          git config user.name "cowinmagnet-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles/articles.json data/news-automation
          git commit -m "Publish scheduled News article"
          git push
